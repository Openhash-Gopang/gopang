<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>K-Mail — 혼디</title>
<meta name="description" content="대화로 메일을 보내고 받는 K-Mail 비서.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/gh/Openhash-Gopang/gopang@main/gopang-wallet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'Pretendard',sans-serif;background:#f5f5f5;color:#111;display:flex;flex-direction:column}
#top-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid #e5e7eb}
#top-bar .icon{font-size:20px}
#top-bar .title{font-weight:700;font-size:15px;flex:1}
#top-bar .back{font-size:12.5px;color:#6b7280;text-decoration:none;background:none;border:none;cursor:pointer}
#thread{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:#111;color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#fff;border:1px solid #e5e7eb;border-bottom-left-radius:4px}
.msg.system-note{align-self:center;background:#eef2ff;color:#4338ca;font-size:12px;padding:6px 12px;border-radius:10px}
.msg.error{align-self:center;background:#fef2f2;color:#9B1C1C;font-size:12.5px}
#typing{align-self:flex-start;font-size:12.5px;color:#9ca3af;padding:0 4px;display:none}
#dock{padding:12px;background:#fff;border-top:1px solid #e5e7eb;display:flex;gap:8px}
#dock textarea{flex:1;resize:none;border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;max-height:120px}
#dock button{border:none;border-radius:12px;background:#111;color:#fff;padding:0 18px;font-size:14px;font-weight:600;cursor:pointer}
#dock button:disabled{background:#d1d5db;cursor:not-allowed}
.wallet-wait{padding:40px 20px;text-align:center;color:#6b7280;font-size:13px}
</style>
</head>
<body>

<div id="top-bar">
  <div class="icon">📬</div>
  <div class="title">K-Mail</div>
  <button class="back" onclick="location.href='/desktop.html'">혼디로</button>
</div>

<div id="thread"></div>
<div id="typing">K-Mail이 입력 중...</div>

<div id="dock">
  <textarea id="input" rows="1" placeholder="누구에게 무엇을 보낼지 말씀해 주세요..." disabled></textarea>
  <button id="send-btn" disabled>보내기</button>
</div>

<script>
const WORKER_URL = 'https://hondi-proxy.tensor-city.workers.dev';
let userGuid = null;
let userPubkey = null;
let history = []; // [{role, content}]

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  document.getElementById('thread').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

async function waitForWallet(timeoutMs = 5000) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) {
    if (window.gopangWallet?.guid && window.gopangWallet?.signPayload) {
      return { guid: window.gopangWallet.guid, pubkey: window.gopangWallet.publicKeyB64u || window.gopangWallet.publicKeyB64 || null };
    }
    await new Promise(r => setTimeout(r, 200));
  }
  return { guid: null, pubkey: null };
}

async function sendTurn() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !userGuid) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  addMsg('user', text);
  history.push({ role: 'user', content: text });
  document.getElementById('typing').style.display = 'block';

  try {
    const ts = Date.now().toString();
    const sigMsg = `kmail-chat:${userGuid}:${ts}`;
    const signature = await window.gopangWallet.signPayload(sigMsg);

    const res = await fetch(`${WORKER_URL}/kmail/chat`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guid: userGuid, pubkey: userPubkey, signature, ts, messages: history }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.detail || data.message || ('HTTP ' + res.status));

    addMsg('assistant', data.reply);
    history.push({ role: 'assistant', content: data.reply });

    if (data.action?.type === 'campaign_created') {
      addMsg('system-note', '예약 캠페인이 생성되었습니다.');
    } else if (data.action?.type === 'rule_created') {
      addMsg('system-note', '자동삭제 규칙이 등록되었습니다.');
    } else if (data.action?.type === 'searched_contacts') {
      addMsg('system-note', '웹 검색을 수행했습니다: ' + data.action.queries.join(', '));
    }
  } catch (e) {
    addMsg('error', '오류: ' + e.message);
  } finally {
    document.getElementById('typing').style.display = 'none';
    document.getElementById('send-btn').disabled = false;
  }
}

document.getElementById('input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
document.getElementById('input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTurn(); }
});
document.getElementById('send-btn').addEventListener('click', sendTurn);

(async function init() {
  const thread = document.getElementById('thread');
  const waitEl = document.createElement('div');
  waitEl.className = 'wallet-wait';
  waitEl.textContent = '지갑 연결 중...';
  thread.appendChild(waitEl);

  const w = await waitForWallet();
  userGuid = w.guid;
  userPubkey = w.pubkey;
  waitEl.remove();

  if (!userGuid) {
    addMsg('error', '지갑 정보를 불러오지 못했습니다. 혼디 앱에서 다시 열어 주세요.');
    return;
  }

  addMsg('assistant', '안녕하세요! K-Mail입니다. 누구에게, 어떤 내용을, 언제 보낼지 말씀해 주시면 도와드릴게요. 메일함 정리(자동삭제 규칙)나 주소록 관리도 도와드립니다.');
  document.getElementById('input').disabled = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('input').focus();
})();
</script>
</body>
</html>
