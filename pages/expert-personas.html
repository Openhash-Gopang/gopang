<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

:root {
  --bg:        #eef1f6;
  --surface:   #ffffff;
  --border:    #e2e8f0;
  --navy:      #0e1c3f;
  --brand:     #0c6cc3;
  --brand-dk:  #094a86;
  --text:      #0f172a;
  --text3:     #475569;
  --text4:     #64748b;
  --radius:    8px;
  --radius-lg: 12px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  font-size: 14px;
  line-height: 1.8;
}

.ug-doc { max-width: 1040px; margin: 0 auto; padding: 40px 24px 80px; }

/* ── 헤더 ── */
.ug-header {
  background: var(--navy); color: #fff; border-radius: var(--radius-lg); padding: 28px 32px; margin-bottom: 24px;
  box-shadow: 0 4px 14px rgba(14,28,63,0.18), 0 1px 4px rgba(14,28,63,0.12);
}
.ug-header h1 { font-size: 26px; font-weight: 600; margin-bottom: 8px; }
.ug-header .ug-sub { font-size: 13.5px; color: #b3bfd1; }

/* ── 1단: 대분류 탭 (한 줄 고정, 컴팩트) ── */
.tier1-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}
.tier1-tab {
  flex: 1 1 0;
  min-width: 0;
  background: var(--surface); border: none; border-radius: 8px;
  padding: 9px 4px; text-align: center; cursor: pointer;
  font-size: 12px; font-weight: 700; color: var(--text3);
  box-shadow: 0 1px 3px rgba(15,23,42,0.10), 0 1px 2px rgba(15,23,42,0.07);
  transition: box-shadow 0.18s ease, transform 0.18s ease, color 0.18s ease;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tier1-tab .t1-count { display: inline; font-size: 10px; font-weight: 500; color: var(--text4); margin-left: 3px; }
.tier1-tab:hover { color: var(--brand-dk); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(15,23,42,0.14), 0 2px 6px rgba(15,23,42,0.08); }
.tier1-tab.active { background: var(--brand); color: #fff; box-shadow: 0 6px 16px rgba(12,108,195,0.35), 0 2px 6px rgba(12,108,195,0.2); }
.tier1-tab.active .t1-count { color: #dbeafe; }
@media (max-width: 640px) {
  .tier1-tabs { overflow-x: auto; }
  .tier1-tab { flex: 0 0 auto; min-width: 84px; font-size: 11px; padding: 8px 6px; }
  .tier1-tab .t1-count { display: block; margin-left: 0; }
}

/* ── 2단: 세부 직업군 탭 ── */
.tier2-wrap {
  background: var(--surface); border-radius: var(--radius-lg); padding: 14px 16px;
  margin-bottom: 24px; box-shadow: 0 1px 4px rgba(15,23,42,0.07);
}
.tier2-label { font-size: 11.5px; font-weight: 700; color: var(--text4); margin-bottom: 10px; letter-spacing: 0.02em; }
.tier2-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tier2-tab {
  background: #f1f5f9; border: none; border-radius: 20px;
  padding: 7px 16px; font-size: 12.5px; font-weight: 600; color: var(--text3);
  cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
  white-space: nowrap;
}
.tier2-tab .t2-count { color: var(--text4); font-weight: 500; margin-left: 4px; }
.tier2-tab:hover { background: #e2e8f0; }
.tier2-tab.active { background: var(--brand); color: #fff; }
.tier2-tab.active .t2-count { color: #dbeafe; }

/* ── 본문 콘텐츠 ── */
.svc-content {
  background: var(--surface); border-radius: var(--radius-lg);
  padding: 40px; min-height: 320px;
  box-shadow: 0 2px 10px rgba(15,23,42,0.08), 0 1px 3px rgba(15,23,42,0.06);

.svc-detail h2 { font-size: 20px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
.svc-detail .svc-eyebrow { font-size: 12px; font-weight: 700; color: var(--brand-dk); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.svc-detail .svc-lead { font-size: 14.5px; color: var(--text3); line-height: 1.7; margin: 10px 0 24px; }
.svc-detail h3 {
  font-size: 15px; font-weight: 600; color: var(--navy);
  margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border);
}
.svc-detail h3:first-of-type { margin-top: 0; }

.svc-callout {
  background: #eff6ff; border: 1px solid #93c5fd; border-left: 4px solid var(--brand);
  border-radius: 8px; padding: 12px 16px; margin: 16px 0; font-size: 13px; color: #1e3a5f;
}
.svc-callout.important { background: #fff7ed; border-color: #fbbf24; border-left-color: #d97706; color: #7c4a03; }

.subfield-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 4px 0 8px; }
.subfield-chip { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--text3); text-align: center; }
@media (max-width: 720px) { .subfield-grid { grid-template-columns: repeat(2, 1fr); } }

.svc-table-wrap { overflow-x: auto; margin: 8px 0 4px; }
table.svc-table { width: 100%; border-collapse: collapse; font-size: 13px; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(15,23,42,0.08); }
table.svc-table th, table.svc-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
table.svc-table thead th { background: #f1f5f9; color: var(--navy); font-weight: 600; white-space: nowrap; }
table.svc-table tbody tr:last-child td { border-bottom: none; }
table.svc-table td.svc-hondi { color: var(--brand-dk); font-weight: 600; }

.ug-footer { text-align: center; font-size: 12px; color: var(--text4); border-top: 1px solid var(--border); padding-top: 18px; margin-top: 40px; }

var CAT_LABEL = { EDU: 'K-EDU', LAW: 'K-Law', HEALTH: 'K-Health', FIN: 'K-Fin', ENG: 'K-Eng', ETC: '기타' };

var CATEGORY_ORDER = { EDU: [], LAW: [], HEALTH: [], FIN: [], ENG: [], ETC: [] };
Object.keys(PROFESSIONS).forEach(function (id) {
  CATEGORY_ORDER[PROFESSIONS[id].category].push(id);
});
CATEGORY_ORDER.EDU.sort(function (a, b) { return PROFESSIONS[b].subCount - PROFESSIONS[a].subCount; });
CATEGORY_ORDER.LAW.sort(function (a, b) { return PROFESSIONS[b].subCount - PROFESSIONS[a].subCount; });
CATEGORY_ORDER.HEALTH.sort(function (a, b) { return PROFESSIONS[b].subCount - PROFESSIONS[a].subCount; });
CATEGORY_ORDER.FIN.sort(function (a, b) { return PROFESSIONS[b].subCount - PROFESSIONS[a].subCount; });

var activeCat = 'EDU';

// ── 공통 렌더 함수: 모든 직업이 이 하나의 템플릿을 공유 (MoTE 방식: 공유 템플릿 + 직업별 소형 데이터) ──
function buildDetailHtml(id) {
  var p = PROFESSIONS[id];
  var subfieldSection = '';
  if (p.subCount > 0) {
    var chips = p.samples.map(function (s) { return '<div class="subfield-chip">' + s + '</div>'; }).join('');
    subfieldSection =
      '<h3>세부 전문분야 (' + p.subCount + '개)</h3>' +
      '<div class="subfield-grid">' + chips + '</div>' +
      '<p style="font-size:12px; color:var(--text4); margin-top:2px;">대표 예시만 표시했습니다. 실제 페이지에서는 전체 ' + p.subCount + '개를 펼침/접기 또는 검색 형태로 제공할 예정입니다.</p>';
  }
  return (
    '<div class="svc-detail">' +
      '<div class="svc-eyebrow">' + CAT_LABEL[p.category] + ' · 전문가 페르소나</div>' +
      '<h2>' + p.icon + ' ' + p.label + ' 페르소나</h2>' +
      '<p class="svc-lead">' + p.lead + '</p>' +
      subfieldSection +
      '<h3>관련 K-서비스와의 관계</h3>' +
      '<div class="svc-table-wrap">' +
        '<table class="svc-table">' +
          '<thead><tr><th>구분</th><th>역할</th></tr></thead>' +
          '<tbody>' +
            '<tr><td>' + p.agencyLabel + '</td><td class="svc-hondi">공익/공적 절차를 담당 — K-서비스가 공익을 우선하는 것과 달리, ' + p.label + ' 페르소나는 사용자 개인의 이익을 우선합니다.</td></tr>' +
          '</tbody>' +
        '</table>' +
      '</div>' +
      '<div class="svc-callout important">' + p.disclaimer + '</div>' +
    '</div>'
  );
}

function renderTier2(cat) {
  var wrap = document.getElementById('tier2Tabs');
  wrap.innerHTML = '';
  CATEGORY_ORDER[cat].forEach(function (id, i) {
    var p = PROFESSIONS[id];
    var el = document.createElement('div');
    el.className = 'tier2-tab' + (i === 0 ? ' active' : '');
    el.setAttribute('data-id', id);
    el.innerHTML = p.icon + ' ' + p.label + (p.subCount > 0 ? '<span class="t2-count">(' + p.subCount + ')</span>' : '');
    wrap.appendChild(el);
  });
  renderContent(CATEGORY_ORDER[cat][0]);
}

function renderContent(id) {
  document.getElementById('svcContent').innerHTML = buildDetailHtml(id);
}

document.getElementById('tier1Tabs').addEventListener('click', function (e) {
  var tab = e.target.closest('.tier1-tab');
  if (!tab) return;
  document.querySelectorAll('.tier1-tab').forEach(function (t) { t.classList.remove('active'); });
  tab.classList.add('active');
  activeCat = tab.getAttribute('data-cat');
  renderTier2(activeCat);
});

document.getElementById('tier2Tabs').addEventListener('click', function (e) {
  var tab = e.target.closest('.tier2-tab');
  if (!tab) return;
  document.querySelectorAll('.tier2-tab').forEach(function (t) { t.classList.remove('active'); });
  tab.classList.add('active');
  renderContent(tab.getAttribute('data-id'));
});

renderTier2('EDU');
