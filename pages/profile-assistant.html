<script type="module" src="/gopang-wallet.js"></script>
<script type="module">
// ══════════════════════════════════════════════════════════════
// profile-assistant 전용 탭 (2026-07-11 신설)
//
// ★ 설계 배경: 기존엔 AC가 [CALL_PROFILE_ASSISTANT]로 "같은 창"의
// system을 profile-assistant로 바꿔치기했다(call-ai.js
// _switchToProfileAssistantSP()). 이 방식은 (a) 튜토리얼이 AC 자신의
// 대본(§0-1-T)에도 섞여 있어 AC가 실제 사용자 지시를 대본으로 착각하고
// 가로채는 사고가 실사로 확인됐고, (b) "탭을 닫으면 중단 지점이 남는다"
// 같은 GWP 방식 서비스(K-Law 등)와 다른 이질적인 UX였다. 이 페이지는
// K-Law·K-Market과 완전히 동일한 "새 탭 + GWP_DONE 보고" 패턴으로
// 재설계한 것이다 — AC는 이제 다른 GWP 서비스와 똑같이
// [GWP: profile-assistant] 태그만 내면 된다(gwp-registry.js 등록,
// _gwpLaunch() 재사용 — 이 페이지 쪽에 새 백엔드 불필요).
//
// ★ 재개(resume) 원리: 이 탭과 원래 창(hondi.net)은 반드시 같은
// 오리진이므로 localStorage를 그대로 공유한다. 튜토리얼/프로필 진행
// 상태(hondi_tutorial_step·hondi_tutorial_done·hondi_profile_step·
// hondi_profile_partial 등)는 매 단계 완료 즉시(AI 응답 태그를 감지하는
// 순간) localStorage에 기록한다 — "정상 종료 이벤트"에 의존하지 않으므로
// 탭이 강제로 닫히거나 브라우저가 죽어도 마지막으로 완료된 단계까지는
// 항상 보존된다. 다음에 이 탭이 다시 열리면 그 상태를 읽어 정확히
// 중단 지점부터 이어간다.
// ══════════════════════════════════════════════════════════════
import { _loadSpByKey } from '/src/gopang/ai/manifest-loader.js';
import { handleProfileSubmit } from '/src/gopang/ui/welcome.js';
import { escHtml, appendBubble, appendTyping, wireBackButton, wireInputBar,
         wireMic, wireAttachAndCamera } from '/src/gopang/ui/chat-shell.js';
import { reportGwpSessionEnd } from 'https://hondi.net/src/gopang/gwp/gwp-report-client.js';

const RELAY_ENDPOINT = 'https://hondi-proxy.tensor-city.workers.dev';
const _qs    = new URLSearchParams(location.search);
const RETURN = _qs.get('return') || 'https://hondi.net';

// 2026-07-27 신설 — AC가 _gwpLaunch()로 넘기는 ctx 파라미터를 지금까지
// 이 파일이 전혀 읽지 않고 있었다(다른 GWP 서비스는 이미 쓰는 일반
// 메커니즘인데 PA만 빠져 있었음 — "AC→PA 서술적 맥락 없음" 사고실험
// 결과와 같은 계보의 결함). 프로필 갱신 제안(§0-1-P 계열, AC 쪽에서
// 발동) 등 "지금 이걸 알려주려고 PA를 불렀다"는 문맥을 여기서 받는다.
function _decodeCtxParam() {
  const raw = _qs.get('ctx');
  if (!raw) return '';
  try {
    if (_qs.get('ctx_enc') === 'b64') return decodeURIComponent(escape(atob(raw)));
    return decodeURIComponent(raw);
  } catch (e) {
    console.warn('[PA] ctx 파라미터 디코딩 실패(무시):', e.message);
    return '';
  }
}
const _acHandoffHint = _decodeCtxParam();

wireBackButton({ onBack: () => { window.close(); location.href = RETURN; } });
const _inputBar = wireInputBar();
wireMic('chat-input', 'mic-btn', _inputBar);
// ★ 2026-07-22 신설 — 이 페이지는 첨부/카메라 UI가 아예 없었다(다른
// GWP 탭 2곳과 레이아웃을 통일하며 새로 추가). 이미지는 doSend()에서
// vision 메시지(content: [{type:'text'},{type:'image_url'}])로
// callPaAI()에 그대로 실어 보낸다 — 아래 messages.push 부분 참고.
const _attach = wireAttachAndCamera({ inputBar: _inputBar, onFileSelected: _onPhotoAttached });

// ── 프로필 사진 저장 (2026-07-27 신설) ──────────────────────────────
// §IMAGE-SCAN은 사진을 "읽어서" 텍스트만 채우고 사진 자체는 남기지
// 않았다(R2 등 바이너리 저장소 부재) — "프로필이 미니 웹사이트로
// 기능해야 한다"는 요구사항에 맞춰, 첨부되는 즉시(백그라운드로) 실제
// 사진을 서버에 올려 URL을 받아두고, PROFILE_SUBMIT 시점에 함께
// 제출한다. 업로드는 AI의 사진 판독(doSend의 vision 메시지)과
// 완전히 독립된 별도 요청이다 — 하나가 실패해도 다른 하나에 영향
// 없음(사진 저장이 실패해도 AI는 여전히 사진을 읽고 텍스트를 채울 수
// 있다).
let _sessionAvatarUrl = null;
const _sessionPhotoUrls = [];

async function _fileToBase64Raw(file) {
  const dataUrl = await _attach.fileToDataUrl(file);
  return { base64: dataUrl.split(',')[1], mimeType: file.type };
}

async function _onPhotoAttached(file) {
  if (!file || !file.type?.startsWith('image/')) return; // 이 페이지는 accept="image/*"라 사실상 항상 참
  const wallet = window.gopangWallet;
  if (!wallet?.signPayload || !wallet.publicKeyB64u) {
    console.warn('[PA] 사진 업로드 보류 — 지갑 준비 전(사진 판독 자체는 그대로 진행됨)');
    return;
  }
  try {
    const { base64, mimeType } = await _fileToBase64Raw(file);
    const guid = _paGuid();
    const pubkey = wallet.publicKeyB64u;
    const ts = String(Math.floor(Date.now() / 1000));
    const signature = await wallet.signPayload(`${guid}:${pubkey}:${ts}`);
    const res = await fetch(`${RELAY_ENDPOINT}/profile/photo-upload`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guid, pubkey, signature, ts, image_base64: base64, mime_type: mimeType }),
    });
    const data = await res.json().catch(() => ({}));
    if (!data.ok || !data.url) {
      console.warn('[PA] 사진 업로드 실패(무시, 판독은 계속 진행):', data.detail || data.error || res.status);
      return;
    }
    _sessionPhotoUrls.push(data.url);
    if (!_sessionAvatarUrl) _sessionAvatarUrl = data.url; // 이 세션 첫 사진(보통 간판·명함)을 아바타 후보로
  } catch (e) {
    console.warn('[PA] 사진 업로드 오류(무시, 판독은 계속 진행):', e.message);
  }
}

// ── 상태 판독(진입 시 1회) ──────────────────────────────────
function _loadUser() { try { return JSON.parse(localStorage.getItem('gopang_user_v4') || 'null'); } catch { return null; } }
const _tutDone = () => { try { return localStorage.getItem('hondi_tutorial_done') === '1'; } catch { return false; } };
const _tutStep = () => { try { return parseInt(localStorage.getItem('hondi_tutorial_step') || '0', 10); } catch { return 0; } };

// GWP 세션 종료 보고(2026-07-26 수정)용 — reportGwpSessionEnd()가 요구하는
// sessionStartedAt/guid를 이 탭 진입 시점에 한 번만 확정해둔다.
const _paSessionStartedAt = new Date().toISOString();
function _paGuid() {
  try {
    const reg = JSON.parse(localStorage.getItem('gopang_user_v4') || '{}');
    return reg.ipv6 || reg.guid || 'anonymous';
  } catch { return 'anonymous'; }
}

// ── AC↔PA 실시간 채널 (2026-07-27 신설) ──────────────────────────────
// 주피터님 지시: "AC는 PA의 진행 상황을 실시간으로 파악하고 있어야
// 한다." PA는 별도 탭이라(EXPERT처럼 같은 history를 공유하지 않음) 매
// STEP마다 opener(AC 탭)에 가벼운 상태를 명시적으로 알려야만 AC가 다음
// 응답에서 그걸 참조할 수 있다. 채팅 버블은 찍지 않는다 — 매 STEP마다
// AC 쪽에 말풍선이 뜨면 애초에 탭을 분리했던 이유(2026-07-11, 대화
// 흐름이 안 끊기게)가 무색해진다. engine.js가 조용히 상태만 들고
// 있다가, 사용자가 AC와 다시 대화할 때 자연스럽게 반영한다.
const _PA_STEP_LABELS = {
  1: '기본 정보 확인 중', 2: '핵심 정보 수집 중', 3: 'GDC 결제 여부 확인 중',
  4: '계좌 이체 지원 확인 중', 5: '예약 기능 확인 중', 6: '공개 여부 확인 중',
};
function _reportProgressToAC(step, total) {
  try {
    if (!window.opener || window.opener.closed) return;
    window.opener.postMessage({
      type: 'GWP_PROGRESS',
      step, total,
      label: _PA_STEP_LABELS[step] || '',
    }, RETURN);
  } catch (e) {
    console.warn('[PA] 진행 상황 보고 실패(무시, 프로필 작성 자체는 계속 진행):', e.message);
  }
}

// _buildProfileContext — call-ai.js의 동명 함수를 그대로 이식(순수 함수,
// localStorage만 읽으므로 call-ai.js 전체를 이 독립 탭에 끌어들이지 않고
// 여기 복제한다 — manifest-loader.js를 별도 파일로 뺀 것과 같은 이유).
// 2026-07-27 신설 — 이미 완성된 프로필을 "갱신"하러 재진입한 경우를 위한
// 조회. 기존엔 hondi_profile_partial(localStorage)만 봤는데, 이 캐시는
// PROFILE_SUBMIT 성공 시 지워진다(§4 STEP-FINAL) — 즉 완성된 프로필을
// 다시 열면 PA가 아무것도 모르는 채로 처음부터 다시 물어보게 돼 있었다
// (AC가 "프로필 갱신"을 제안해 재호출하는 이번 기능의 전제 자체가
// 성립 안 함). profile.html의 뷰어 서명 패턴(view:guid:pubkey:ts)을
// 그대로 재사용해 본인 인증된 전체 데이터를 받아온다.
async function _fetchExistingProfileForUpdate() {
  try {
    const reg = JSON.parse(localStorage.getItem('gopang_user_v4') || '{}');
    const handle = (reg.handle || '').replace(/^@/, '');
    if (!handle) return null;
    const wallet = window.gopangWallet;
    if (!wallet?.signPayload) return null;
    const pubkey = wallet.publicKeyB64u || wallet.publicKeyB64 || '';
    const guid = reg.ipv6 || reg.guid || '';
    if (!pubkey || !guid) return null;
    const ts = Date.now().toString();
    const sigMsg = `view:${guid}:${pubkey}:${ts}`;
    const sig = await wallet.signPayload(sigMsg);
    const qs = `viewer_guid=${encodeURIComponent(guid)}&viewer_pubkey=${encodeURIComponent(pubkey)}` +
               `&viewer_sig=${encodeURIComponent(sig)}&viewer_ts=${encodeURIComponent(ts)}`;
    const res = await fetch(`${RELAY_ENDPOINT}/profile/@${encodeURIComponent(handle)}?${qs}`);
    const data = await res.json().catch(() => null);
    return (data?.ok && data.profile) ? data.profile : null;
  } catch (e) {
    console.warn('[PA] 기존 프로필 조회 실패(무시, 새로 작성하는 것처럼 진행):', e.message);
    return null;
  }
}

async function _buildProfileContext() {
  let reg = {};
  try { reg = JSON.parse(localStorage.getItem('gopang_user_v4') || '{}'); } catch {}
  let partial = {};
  try { partial = JSON.parse(localStorage.getItem('hondi_profile_partial') || '{}'); } catch {}
  let doneFlag = false, skippedFlag = false;
  try {
    doneFlag    = localStorage.getItem('hondi_profile_done')    === '1';
    skippedFlag = localStorage.getItem('hondi_profile_skipped') === '1';
  } catch {}

  // 2026-07-27 신설 — "이미 완성된 프로필을 갱신하러 재진입" 케이스.
  // hondi_profile_partial은 PROFILE_SUBMIT 성공 시 지워지므로(§4
  // STEP-FINAL), 완성된 프로필을 다시 열면 지금까지는 partial이 텅 비어
  // PA가 아무것도 모르는 채 처음부터 다시 물어보고 있었다 — 이러면 AC가
  // 제안하는 "프로필 갱신"이 실제로는 "프로필 재작성"이 돼버린다.
  let existingPublic = {}, existingTop = {};
  if (doneFlag) {
    const existing = await _fetchExistingProfileForUpdate();
    if (existing) {
      existingTop = existing;
      existingPublic = existing.extra?.public || {};
    }
  }

  const ctx = Object.assign({}, {
    guid: reg.ipv6 || reg.guid || '', handle: reg.handle || '',
    nickname: reg.nickname || '', region: reg.region || '', e164: reg.e164 || '',
  }, {
    // existingTop/existingPublic이 있으면(=완성된 프로필 갱신) 그게
    // 우선이고, 없으면(=신규/재개 온보딩) 기존처럼 partial을 쓴다.
    name:            existingTop.name ?? partial.name,
    address:         existingTop.address ?? partial.address,
    phone:           existingTop.phone ?? partial.phone,
    entity_type:     existingTop.entity_type ?? partial.entity_type,
    entity_subtype:  existingPublic.identity?.entity_subtype ?? partial.entity_subtype,
    schema_id:       existingPublic.industry_fields?.schema_id ?? partial.schema_id,
    products:        existingPublic.products ?? partial.products,
    description:     existingPublic.identity?.description ?? partial.description,
  }, partial); // partial이 이번 세션 중 새로 갱신한 값이 있으면 최종적으로 그걸 우선

  const step = parseInt(localStorage.getItem('hondi_profile_step') || '0', 10);
  const firstGreeted  = localStorage.getItem('hondi_first_greeted')  === '1';
  const namePending   = localStorage.getItem('hondi_name_pending')   === '1';
  const assistantName = localStorage.getItem('hondi_assistant_name') || '';
  const lines = ['[CONTEXT: PROFILE_ONBOARDING]'];
  lines.push(`step: ${step}`, `done: ${doneFlag}`, `skipped: ${skippedFlag}`,
             `first_greeted: ${firstGreeted}`, `name_pending: ${namePending}`);
  if (assistantName)      lines.push(`assistant_name: ${assistantName}`);
  if (ctx.guid)           lines.push(`guid: ${ctx.guid}`);
  if (ctx.handle)         lines.push(`handle: ${ctx.handle}`);
  if (ctx.nickname)       lines.push(`nickname: ${ctx.nickname}`);
  if (ctx.region)         lines.push(`region: ${ctx.region}`);
  if (ctx.e164)           lines.push(`e164: ${ctx.e164}`);
  if (ctx.name)           lines.push(`name: ${ctx.name}`);
  if (ctx.address)        lines.push(`address: ${ctx.address}`);
  if (ctx.phone)          lines.push(`phone: ${ctx.phone}`);
  if (ctx.entity_type)    lines.push(`entity_type: ${ctx.entity_type}`);
  if (ctx.entity_subtype) lines.push(`entity_subtype: ${ctx.entity_subtype}`);
  if (ctx.schema_id)      lines.push(`schema_id: ${ctx.schema_id}`);
  if (ctx.products)       lines.push(`products: ${JSON.stringify(ctx.products)}`);
  if (ctx.description)    lines.push(`description: ${ctx.description}`);
  // 2026-07-27 신설 — 완성된 프로필을 갱신 모드로 여는 경우, 나머지
  // 세부 필드(재확인 불필요한 것들)도 실어서 PA가 STEP을 건너뛰며
  // 자연스럽게 통째로 다시 알 수 있게 한다. §PROFILE-UPDATE-MODE가
  // PROFILE_SUBMIT 재구성 시 이 값들을 그대로 옮겨 담아야 유실이 없다.
  if (doneFlag && Object.keys(existingPublic).length) {
    if (existingPublic.finance)  lines.push(`_existing_finance: ${JSON.stringify(existingPublic.finance)}`);
    if (existingPublic.industry_fields) lines.push(`_existing_industry_fields: ${JSON.stringify(existingPublic.industry_fields)}`);
    if (existingPublic.field_visibility) lines.push(`_existing_field_visibility: ${JSON.stringify(existingPublic.field_visibility)}`);
    if (existingPublic.avatar_url) lines.push(`_existing_avatar_url: ${existingPublic.avatar_url}`);
    if (Array.isArray(existingPublic.photo_urls) && existingPublic.photo_urls.length) lines.push(`_existing_photo_urls: ${JSON.stringify(existingPublic.photo_urls)}`);
    lines.push(`_existing_is_public: ${!!existingTop.is_public}`);
  }
  lines.push('[/CONTEXT]');

  // AC↔PA 채널(2026-07-27 신설) — AC가 프로필 갱신을 제안해 사용자가
  // 승인하고 PA를 호출한 경우, _gwpLaunch의 ctx 파라미터로 "왜 지금
  // PA가 열렸는지"가 함께 온다. 이걸 별도 블록으로 분리해서, PA SP의
  // [§PROFILE-UPDATE-MODE]가 이 블록의 유무로 갱신 모드 진입 여부를
  // 판단하게 한다.
  const hintBlock = _acHandoffHint
    ? `\n\n[CONTEXT: PROFILE_UPDATE_HINT]\n${_acHandoffHint}\n[/CONTEXT]`
    : '';

  return lines.join('\n') + hintBlock;
}

let systemPrompt = null, messages = [];
async function ensureSystemPrompt() {
  if (systemPrompt) return systemPrompt;
  systemPrompt = await _loadSpByKey('profile-assistant', 'Profile-Assistant')
    .catch(e => { throw new Error('profile-assistant SP 로드 실패: ' + e.message); });
  messages = [{ role: 'system', content: systemPrompt }];
  return systemPrompt;

// ── AI 호출 (expert-chat.html과 동일한 후보 폴백 패턴) ──────
function _loadCfg() { try { return JSON.parse(localStorage.getItem('gopang_cfg') || '{}'); } catch { return {}; } }
function _buildCandidates() {
  const cfg = _loadCfg();
  const candidates = [];
  if (Array.isArray(cfg.providers)) {
    for (const p of cfg.providers) {
      if (!p?.apiKey || !p?.model || !p?.baseUrl) continue;
      candidates.push({ provider: p.provider, baseUrl: p.baseUrl.replace(/\/+$/,''), model: p.model, apiKey: p.apiKey });
    }
  }
  if (!candidates.length && cfg.apiKey && cfg.endpoint && !cfg.endpoint.includes('workers.dev')) {
    candidates.push({ provider: 'legacy', baseUrl: cfg.endpoint.replace(/\/+$/,''), model: cfg.model || 'gpt-4o-mini', apiKey: cfg.apiKey });
  }
  candidates.push({ provider: 'deepseek-default', baseUrl: RELAY_ENDPOINT, model: 'hondi-flash', apiKey: null });
  return candidates;
}
async function _pumpSSE(response, onJson) {
  if (!response.ok) {
    let msg = `HTTP ${response.status}`;
    try { const b = await response.json(); msg = b.message || b.error?.message || b.error || msg; } catch (e) {}
    throw new Error(msg);
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      const t = line.trim();
      if (!t.startsWith('data:')) continue;
      const payload = t.slice(5).trim();
      if (payload === '[DONE]') continue;
      let json;
      try { json = JSON.parse(payload); } catch (e) { continue; }
      onJson(json);
    }
  }
}
async function callPaAI(msgs, onChunk) {
  const candidates = _buildCandidates();
  const user = _loadUser();
  let lastErr = null;
  for (const c of candidates) {
    try {
      const reqBody = { model: c.model, messages: msgs, max_tokens: 1200, temperature: 0.5, stream: true };
      const resp = c.provider === 'legacy'
        ? await fetch(`${c.baseUrl}/chat/completions`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${c.apiKey}` },
            body: JSON.stringify(reqBody),
          })
        : c.provider === 'deepseek-default'
        ? await fetch(`${c.baseUrl}/deepseek`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...reqBody, guid: user?.ipv6 || null }),
          })
        : await fetch(`${RELAY_ENDPOINT}/llm/relay`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider: c.provider, baseUrl: c.baseUrl, apiKey: c.apiKey, ...reqBody }),
          });
      let fullText = '';
      await _pumpSSE(resp, (json) => {
        const delta = json.choices?.[0]?.delta?.content || '';
        if (delta) { fullText += delta; onChunk && onChunk(delta, fullText); }
      });
      return fullText;
    } catch (e) {
      lastErr = e;
      console.warn(`[PA] ${c.provider} 실패 — 다음 후보로 전환:`, e.message);
      continue;
    }
  }
  throw lastErr || new Error('모든 호출 후보 실패');
}

// ── 태그 처리 (call-ai.js _handleProfileTags에서 이식 — 탭 종료 방식만 다름) ──
function _stripInternalTags(s) {
  return String(s ?? '')
    .replace(/\[TUTORIAL_STEP:[^\]]*\]/g, '')
    .replace(/\[TUTORIAL_ADVANCE:\d+\]/g, '')
    .replace(/\[PANEL_ACTION:close\]/g, '')
    .replace(/PROFILE_SUBMIT\s*\{[\s\S]*?\n\}/, '')
    .replace(/\[PROFILE_SKIP\]/g, '')
    .replace(/\[PARTIAL_SAVE\][\s\S]*?\}/g, '')
    .replace(/\[\d+\/\d+단계\]/g, '')
    .replace(/\[PROFILE_INTERRUPT_HANDOFF\]/g, '')
    // 2026-07-27 신설 — 아래 4개가 지금까지 빠져 있어(PA 전용 사고실험으로
    // 발견) 해당 태그가 나올 때마다 원문이 그대로 채팅 버블에 노출되고
    // 있었다(특히 TEMPLATE_LOOKUP은 사업자 가입 세션 대부분에서 STEP1
    // 직후 매번 발생 — 가장 흔하고 눈에 띄는 증상이었을 것).
    .replace(/\[TEMPLATE_LOOKUP:[^\]]*\]/g, '')
    .replace(/\[INDUSTRY_TEMPLATE_LOOKUP:[^\]]*\]/g, '')
    .replace(/\[TEMPLATE_CANDIDATE:[^\]]*\]/g, '')
    .replace(/\[FEATURE_SUGGESTION:[^\]]*\]/g, '')
    .trim();
}

let _closing = false;
// ── 프로필 완성 요약 (2026-07-13 신설) ──────────────────────
// GWP_DONE의 summary로 실려 나가면 engine.js가 채팅 버블에 자동 표시한다
// (다른 GWP 서비스와 동일 메커니즘). profile-assistant SP의 [§PROFILE_CARD]
// 포맷(이모지+한 줄)을 클라이언트 쪽에서 동일하게 재현 — 두 표현이
// 어긋나지 않도록 SP 문서 쪽 포맷을 바꾸면 여기도 함께 갱신해야 한다.
function _buildProfileSummaryText(profile) {
  const isBiz = profile.entity_type && profile.entity_type !== 'person';
  const label = profile.name || profile.nickname || '(이름 미상)';
  const lines = [];
  if (!isBiz) {
    lines.push(`👤 ${label}`);
    if (profile.address) lines.push(`📍 ${profile.address}`);
    if (profile.phone)   lines.push(`📞 ${profile.phone}`);
    lines.push(profile.is_public ? '🌐 다른 이용자에게 공개돼요' : '🔒 비공개로 둘게요');
  } else {
    lines.push(`🏪 ${label}`);
    if (profile.address) lines.push(`📍 ${profile.address}`);
    if (profile.products) lines.push(`🍜 ${profile.products}`);
    if (profile.gdc_accepted) lines.push('💳 GDC 결제도 받아요');
    lines.push(profile.is_public ? '🌐 K-Market 등에서 검색돼요' : '🔒 비공개로 둘게요');
  }
  return `🎉 프로필 완성됐어요!\n\n${lines.join('\n')}`;
}

function _closeTabSoon(delayMs = 900) {

// ── 업종 템플릿 조회 (2026-07-13 신설) ─────────────────────
// 동종업계(같은 schema_id) 공개 프로필 최대 8건에서 다수가 가진
// industry_fields 키만 추출한다 — 개별 업체명·연락처는 절대 넘기지
// 않고 "필드 구조"만 참조로 넘긴다. /search는 handleSearch가
// schema_id alias를 KSIC_LABELS로 자동 해석해준다(worker.js 2026-07-13).
// [TEMPLATE_LOOKUP] — 정체성/업종 템플릿 참조 조회 (2026-07-27 버그 수정)
// 이 파일은 2026-07-17 태그 개편(구 [INDUSTRY_TEMPLATE_LOOKUP: schema_id=NN]
// → 신 [TEMPLATE_LOOKUP: schema_id=.., job_ksco_code=.., work_domain=..])
// 이후 한 번도 갱신되지 않아, SP가 실제로 내는 새 태그를 이 탭에서는
// 전혀 인식하지 못하고 있었다(call-ai.js에만 대응 코드가 있었음 — PA는
// 2026-07-11부터 별도 탭에서 독립 실행되므로 call-ai.js 쪽 수정은 이
// 탭에 아무 영향이 없었다). _stripInternalTags에도 이 태그가 없어
// 사업자 가입 세션 거의 전부(STEP1에서 schema_id·job_ksco가 확정되는
// 순간)에서 "[TEMPLATE_LOOKUP: ...]" 원문이 그대로 채팅 버블에 노출되고
// 대화가 멈추는 상태였다(PA 전용 사고실험으로 발견). worker.js의
// /template-lookup(handleTemplateLookup, 2026-07-17 신설 — schema_id·
// job_ksco_code/work_domain 두 축을 독립 조회)을 call-ai.js와 동일한
// 방식으로 호출하도록 여기서도 새로 배선한다.
async function _lookupTemplateAxis(body) {
  try {
    const res = await fetch(`${RELAY_ENDPOINT}/template-lookup`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) return [];
    const data = await res.json().catch(() => ({ refs: [] }));
    return data.refs || [];
  } catch (e) {
    console.warn('[PA] template-lookup 요청 실패(무시 — 빈 참조로 진행):', e.message);
    return [];
  }
}

async function _handleReplyTags(fullReply) {
  // 업종/개인 템플릿 조회 — 새 태그([TEMPLATE_LOOKUP: schema_id=.., job_ksco_code=..,
  // work_domain=..])와 과도기 구 태그([INDUSTRY_TEMPLATE_LOOKUP: schema_id=..])를
  // 모두 인식한다(call-ai.js와 동일 관례).
  const templateLookupMatch =
    fullReply.match(/\[TEMPLATE_LOOKUP:\s*([^\]]*)\]/) ||
    fullReply.match(/\[INDUSTRY_TEMPLATE_LOOKUP:\s*([^\]]*)\]/);
  if (templateLookupMatch) {
    const raw = templateLookupMatch[1];
    const params = {};
    for (const part of raw.split(',')) {
      const eq = part.indexOf('=');
      if (eq === -1) continue;
      const k = part.slice(0, eq).trim();
      const v = part.slice(eq + 1).trim();
      if (k) params[k] = v;
    }
    const workDomainStatuses = params.work_domain
      ? params.work_domain.split('+').map(s => s.trim()).filter(Boolean)
      : undefined;

    const lookups = [];
    if (params.schema_id) {
      lookups.push({ label: 'INDUSTRY_TEMPLATE', body: { entity_type: 'business', schema_id: params.schema_id } });
    }
    if (params.job_ksco_code || workDomainStatuses) {
      lookups.push({
        label: 'PERSON_TEMPLATE',
        body: { entity_type: 'person', job_ksco_code: params.job_ksco_code || undefined, work_domain_statuses: workDomainStatuses },
      });
    }

    const contextBlocks = [];
    for (const { label, body } of lookups) {
      const refs = await _lookupTemplateAxis(body);
      contextBlocks.push(
        refs.length
          ? `[CONTEXT: ${label}]\n${JSON.stringify(refs)}\n[/CONTEXT]`
          : `[CONTEXT: ${label}]\n(참조 사례 없음 — 최초 사례)\n[/CONTEXT]`
      );
    }
    await sendTurn(contextBlocks.join('\n'));
    return;
  }
  // 진행 중 필드 저장 [PARTIAL_SAVE]
  if (!localStorage.getItem('hondi_profile_done')) {
    const partialMatch = fullReply.match(/\[PARTIAL_SAVE\]\s*(\{[\s\S]*?\})/);
    if (partialMatch) {
      try {
        const incoming = JSON.parse(partialMatch[1]);
        const existing = JSON.parse(localStorage.getItem('hondi_profile_partial') || '{}');
        localStorage.setItem('hondi_profile_partial', JSON.stringify(Object.assign(existing, incoming)));
      } catch {}
    }
  }
  // 단계 업데이트 [N/6단계]
  const stepMatch = fullReply.match(/\[(\d+)\/(\d+)단계\]/);
  if (stepMatch && !localStorage.getItem('hondi_profile_done')) {
    try { localStorage.setItem('hondi_profile_step', stepMatch[1]); } catch {}
    _reportProgressToAC(parseInt(stepMatch[1], 10), parseInt(stepMatch[2], 10));
  }
  // TUTORIAL_ADVANCE — 매 단계 즉시 저장(탭 강제종료에도 보존)
  const tutAdv = fullReply.match(/\[TUTORIAL_ADVANCE:(\d+)\]/);
  if (tutAdv) {
    const nextStep = parseInt(tutAdv[1], 10);
    try {
      if (nextStep >= 7) {
        localStorage.setItem('hondi_tutorial_done', '1');
        localStorage.removeItem('hondi_tutorial_step');
      } else {
        localStorage.setItem('hondi_tutorial_step', String(nextStep));
      }
    } catch {}
  }
  // TEMPLATE_CANDIDATE — 최초 사례 템플릿 후보 큐잉 (2026-07-27 버그 수정)
  // call-ai.js에는 이 처리가 있었지만 이 탭(실제 PA가 실행되는 곳)에는
  // 없었다 — §TEMPLATE-LISTING이 PROFILE_SUBMIT과 함께 내는 태그인데
  // 여기서 한 번도 큐잉된 적이 없었다(PA 전용 사고실험으로 발견).
  const templateCandidateMatch = fullReply.match(/\[TEMPLATE_CANDIDATE:\s*([^\]]*)\]/);
  if (templateCandidateMatch) {
    try {
      const raw = templateCandidateMatch[1];
      const params = {};
      for (const part of raw.split(',')) {
        const eq = part.indexOf('=');
        if (eq === -1) continue;
        params[part.slice(0, eq).trim()] = part.slice(eq + 1).trim();
      }
      const queue = JSON.parse(localStorage.getItem('hondi_template_candidates') || '[]');
      queue.push({ ...params, queued_at: new Date().toISOString() });
      localStorage.setItem('hondi_template_candidates', JSON.stringify(queue));
    } catch (e) {
      console.warn('[PA] TEMPLATE_CANDIDATE 큐잉 실패(무시):', e.message);
    }
  }
  // FEATURE_SUGGESTION — §DIGITAL-BRIDGE(profile-assistant SP v2.16)가
  // "실재하지 않는 디지털 전환 아이디어"를 발견했을 때 사람이 검토할 수
  // 있게 로컬 큐에 남긴다(TEMPLATE_CANDIDATE와 동일한 큐잉 패턴 —
  // 전체 사용자 통계가 필요한 결정은 이 탭의 일이 아니다).
  const featureSuggestionMatch = fullReply.match(/\[FEATURE_SUGGESTION:\s*([^\]]*)\]/);
  if (featureSuggestionMatch) {
    try {
      const raw = featureSuggestionMatch[1];
      const params = {};
      for (const part of raw.split(',')) {
        const eq = part.indexOf('=');
        if (eq === -1) continue;
        const k = part.slice(0, eq).trim();
        let v = part.slice(eq + 1).trim();
        if (v.startsWith('"') && v.endsWith('"')) v = v.slice(1, -1); // context="...", idea="..." 따옴표 제거
        params[k] = v;
      }
      const queue = JSON.parse(localStorage.getItem('hondi_feature_suggestions') || '[]');
      queue.push({ ...params, guid: _paGuid(), queued_at: new Date().toISOString() });
      localStorage.setItem('hondi_feature_suggestions', JSON.stringify(queue));
      console.info('[PA] 새 기능 제안 큐잉:', params);
    } catch (e) {
      console.warn('[PA] FEATURE_SUGGESTION 큐잉 실패(무시):', e.message);
    }
  }
  // PROFILE_SUBMIT — 실제 서버 등록(welcome.js 그대로 재사용)
  if (fullReply.includes('PROFILE_SUBMIT')) {
    let savedProfile = null;
    try {
      savedProfile = await handleProfileSubmit(fullReply, {
        avatar_url: _sessionAvatarUrl,
        photo_urls: _sessionPhotoUrls,
      });
    }
    catch (e) { console.warn('[PA] handleProfileSubmit 실패:', e.message); }
    try {
      localStorage.setItem('hondi_profile_done', '1');
      localStorage.removeItem('hondi_profile_step');
      localStorage.removeItem('hondi_profile_skipped');
      localStorage.removeItem('hondi_profile_partial');
    } catch {}
    // 2026-07-13 신설, 2026-07-26 수정 — 이 페이지 상단 주석은 애초에
    // "K-Law·market과 동일한 GWP_DONE 보고 패턴"이라고 설명하고 있었지만,
    // 실제로는 한 번도 window.opener.postMessage(GWP_DONE)을 호출하지
    // 않고 있었다(2026-07-13에 발견된 gap — _closeTabSoon()이 그냥
    // 탭만 닫음). 그때 손으로 postMessage를 짜 넣어 채팅 버블 표시는
    // 고쳤지만, 공유모듈(reportGwpSessionEnd)을 안 써서 reporter_svc를
    // 직접 채운 탓에 gopang 허브가 "이 서비스가 자기 PDV를 알아서
    // 기록했겠지"라고 판단해 자체 기록을 건너뛰는데, 정작 이 페이지는
    // 자기 PDV(/pdv/report)를 한 번도 쓴 적이 없어 완료된 세션이 PDV에
    // 전혀 남지 않는 두 번째 gap이 있었다(2026-07-26 발견). 이제 다른
    // GWP 서비스 18곳과 동일하게 공유모듈로 위임한다 — 자기 PDV 기록
    // (a)과 owner_pdv consultation 기록(c)을 함께 받는다.
    if (savedProfile && window.opener && !window.opener.closed) {
      try {
        await reportGwpSessionEnd({
          agencyId:         'profile-assistant',
          guid:              _paGuid(),
          messages,
          resultText:        fullReply,
          summaryLine:       _buildProfileSummaryText(savedProfile),
          gwpMode:           true,
          gwpOrigin:         RETURN,
          sessionStartedAt:  _paSessionStartedAt,
        });
      } catch (e) {
        console.warn('[PA] GWP_DONE 보고 실패(무시, 프로필 저장 자체는 정상 처리됨):', e.message);
      }
    }
    _closeTabSoon();
    return;
  }
  // PROFILE_SKIP — 재개를 위해 단계·작성분 보존, 탭만 닫는다
  if (fullReply.includes('[PROFILE_SKIP]')) {
    try { localStorage.setItem('hondi_profile_skipped', '1'); } catch {}
    _closeTabSoon();
    return;
  }
  // PROFILE_INTERRUPT_HANDOFF — 프로필과 무관한 요청, AC에게 돌려보낸다
  // (같은 창 전환 시절엔 AC SP로 바꿔치기했지만, 새 탭 구조에서는 그냥
  // 이 탭을 닫아 원래 창의 AC가 이어받게 하면 된다 — AC는 이미 그 창에서
  // 대기 중이다.)
  if (fullReply.includes('[PROFILE_INTERRUPT_HANDOFF]')) {
    _closeTabSoon(300);
    return;
  }
  // PANEL_ACTION:close — 튜토리얼 종료 후 "닫을까요?"에 사용자가 동의
  if (fullReply.includes('[PANEL_ACTION:close]')) {
    _closeTabSoon();
    return;
  }
}

async function sendTurn(text, imageDataUrl) {
  const typing = appendTyping();
  const aiBubble = appendBubble('ai', '');
  aiBubble.style.display = 'none';
  try {
    await ensureSystemPrompt();
    messages.push(imageDataUrl ? {
      role: 'user',
      content: [
        ...(text ? [{ type: 'text', text }] : []),
        { type: 'image_url', image_url: { url: imageDataUrl } },
      ],
    } : { role: 'user', content: text });
    let shown = false;
    const full = await callPaAI(messages, (delta, fullText) => {
      if (!shown) { typing.remove(); aiBubble.style.display = ''; shown = true; }
      aiBubble.innerHTML = escHtml(_stripInternalTags(fullText)).replace(/\n/g, '<br>');
      document.getElementById('chat-thread').scrollTop = 1e9;
    });
    messages.push({ role: 'assistant', content: full });
    aiBubble.innerHTML = escHtml(_stripInternalTags(full)).replace(/\n/g, '<br>');
    await _handleReplyTags(full);
  } catch (e) {
    typing.remove();
    aiBubble.remove();
    appendBubble('ai', `⚠️ 응답 중 오류가 발생했습니다: ${escHtml(e.message)}. 잠시 후 다시 시도해 주세요.`);
  }
}

// ── 진입 트리거 — 튜토리얼 미완료면 PHASE -1부터, 완료면 PHASE 0부터 ──
async function startGreeting() {
  const ctxBlock = await _buildProfileContext();
  if (!_tutDone()) {
    document.getElementById('tb-sub').textContent = '앱 사용법 안내 중…';
    await sendTurn(
      `[INTERNAL: AGENT-COMMON→profile-assistant 인계(튜토리얼부터) — ` +
      `사용자에게 보이지 않는 내부 신호입니다. AC가 이미 첫 인사를 마쳤고 ` +
      `사용자가 방금 준비됐다고 답했습니다. 재인사하지 말고, PHASE -1 STEP 0부터 ` +
      `곧바로 시작하세요.]\n\n${ctxBlock}`
    );
  } else {
    document.getElementById('tb-sub').textContent = '프로필 작성 중…';
    await sendTurn(
      `[INTERNAL: AGENT-COMMON→profile-assistant 인계 — 사용자에게 보이지 않는 ` +
      `내부 신호입니다. 앱 사용법 튜토리얼은 이미 완료된 상태입니다. 재인사하지 ` +
      `말고, [CONTEXT]를 읽어 PHASE 0 분기부터 자연스럽게 이어서 시작하세요.]\n\n${ctxBlock}`
    );
  }
}

// ── 입력 바 ──────────────────────────────────────────────
// 자동 리사이즈·아이콘 접힘·전송 버튼 활성화는 wireInputBar()가 이미
// 처리한다(위에서 배선됨) — 여기서는 실제 전송 로직만 담당.
const input = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});
sendBtn.addEventListener('click', doSend);
async function doSend() {
  const text = input.value.trim();
  const file = _attach.getAttachedFile();
  if (!text && !file) return;
  input.value = ''; input.dispatchEvent(new Event('input'));

  let imageDataUrl = null;
  if (file) {
    try { imageDataUrl = await _attach.fileToDataUrl(file); }
    catch (e) { appendBubble('ai', `⚠️ 이미지를 읽지 못했습니다: ${escHtml(e.message)}`); return; }
    _attach.setAttachedFile(null);
  }

  appendBubble('user',
    (text ? escHtml(text).replace(/\n/g, '<br>') : '') +
    (imageDataUrl ? `<img src="${imageDataUrl}" style="max-width:180px;max-height:160px;border-radius:8px;display:block;margin-top:4px">` : '')
  );
  sendTurn(text, imageDataUrl);
}

// ── 탭 종료 시 최소 기록(정상 종료 못 해도 안전망) ──────────
// 위 _handleReplyTags에서 이미 매 단계 즉시 저장하므로 이건 사실상
// 이중 안전망이다 — 스트리밍 도중 탭이 닫히는 극단적 타이밍에도
// 마지막으로 완료된 단계는 이미 저장돼 있다.
window.addEventListener('pagehide', () => {
  console.info('[PA] 탭 종료 — 마지막 저장 단계: 튜토리얼=' +
    (localStorage.getItem('hondi_tutorial_step') || (localStorage.getItem('hondi_tutorial_done')==='1'?'완료':'0')) +
    ', 프로필=' + (localStorage.getItem('hondi_profile_step') || '0'));
});

// ── PDV 필드 사전 요청 (2026-07-13 신설) ────────────────────
// 지금까지 이 페이지는 GWP_PDV_REQUEST를 한 번도 보낸 적이 없었다
// (수신 측 _handlePdvRequest는 이미 있었지만 발신이 빠져 있던 gap).
// 원래 창(AC)에게 부족한 필드를 요청해, 사용자 승인 시에만
// hondi_profile_partial에 미리 채워 같은 질문을 다시 안 묻게 한다.
function _requestPdvFields(fields, reason) {
  return new Promise((resolve) => {
    if (!window.opener || window.opener.closed) { resolve(null); return; }
    const requestId = 'pareq-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      window.removeEventListener('message', onMsg);
      resolve(null); // 타임아웃 — 평소처럼 대화로 물어보는 경로로 자연스럽게 폴백
    }, 20000);
    function onMsg(e) {
      if (e.source !== window.opener) return; // 원래 창에서 온 응답만 신뢰
      const msg = e.data;
      if (!msg || msg.type !== 'GWP_PDV_RESPONSE' || msg.request_id !== requestId) return;
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      window.removeEventListener('message', onMsg);
      resolve(msg.approved ? msg.values : null);
    }
    window.addEventListener('message', onMsg);
    window.opener.postMessage({
      type: 'GWP_PDV_REQUEST',
      request_id: requestId,
      requesting_sp: 'profile-assistant',
      fields,
      reason,
    }, RETURN);
  });
}

async function _prefillFromPdvIfNeeded() {
  try {
    const partial = JSON.parse(localStorage.getItem('hondi_profile_partial') || '{}');
    const needed = [];
    if (!partial.products) needed.push('취급 상품·서비스');
    if (!partial.entity_subtype) needed.push('업종');
    if (!needed.length) return;

    const values = await _requestPdvFields(needed, '프로필 작성에 참고하기 위해');
    if (!values) return;

    // PDV 필드명 → profile-assistant 필드명 매핑
    const FIELD_MAP = { '취급 상품·서비스': 'products', '업종': 'entity_subtype' };
    let changed = false;
    for (const [pdvField, profileKey] of Object.entries(FIELD_MAP)) {
      const v = values[pdvField];
      if (!v || (typeof v === 'object' && v.not_in_pdv)) continue;
      if (!partial[profileKey]) { partial[profileKey] = v; changed = true; }
    }
    if (changed) localStorage.setItem('hondi_profile_partial', JSON.stringify(partial));
  } catch (e) {
    console.warn('[PA] PDV 필드 요청 실패(무시, 평소처럼 대화로 진행):', e.message);
  }
}

(async () => {
  await _prefillFromPdvIfNeeded();
  startGreeting();
})();
</script>
