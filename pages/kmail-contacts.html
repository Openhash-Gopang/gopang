<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>K-Mail 주소록 — 혼디</title>
<meta name="description" content="주소록과 각 연락처별 메일 왕래 이력.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/gh/Openhash-Gopang/gopang@main/gopang-wallet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Pretendard',sans-serif;background:#f5f5f5;color:#111;min-height:100dvh;padding-bottom:40px}
#top-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0}
#top-bar .icon{font-size:20px}
#top-bar .title{font-weight:700;font-size:15px;flex:1}
#top-bar .back{font-size:12.5px;color:#6b7280;text-decoration:none;background:none;border:none;cursor:pointer}
#search-bar{padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb}
#search-bar input{width:100%;padding:9px 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:13.5px;font-family:inherit}
#list{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.contact-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
.contact-head{padding:13px 15px;cursor:pointer;display:flex;align-items:center;gap:10px}
.contact-head .avatar{width:34px;height:34px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.contact-head .info{flex:1;min-width:0}
.contact-head .name{font-size:14px;font-weight:600}
.contact-head .meta{font-size:11.5px;color:#6b7280;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-head .chev{color:#9ca3af;font-size:12px;transition:transform .15s}
.contact-card.open .chev{transform:rotate(90deg)}
.thread{display:none;border-top:1px solid #f0f0f0}
.contact-card.open .thread{display:block}
.thread-loading{padding:14px;font-size:12.5px;color:#9ca3af;text-align:center}
.mail-row{padding:11px 15px;border-top:1px solid #f7f7f7;cursor:pointer}
.mail-row:first-child{border-top:none}
.mail-row .row-top{display:flex;align-items:center;gap:8px}
.mail-row .dir{font-size:10.5px;padding:2px 6px;border-radius:6px;font-weight:600;flex-shrink:0}
.mail-row .dir.sent{background:#eef2ff;color:#4338ca}
.mail-row .dir.received{background:#f0fdf4;color:#15803d}
.mail-row .subject{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail-row .date{font-size:11px;color:#9ca3af;flex-shrink:0}
.mail-body{display:none;margin-top:8px;padding:10px;background:#fafafa;border-radius:8px;font-size:12.5px;line-height:1.6;white-space:pre-wrap;color:#374151}
.mail-row.open .mail-body{display:block}
.empty,.wallet-wait,.err{padding:30px 16px;text-align:center;color:#6b7280;font-size:13px}
.err{color:#9B1C1C}
</style>
</head>
<body>

<div id="top-bar">
  <div class="icon">👥</div>
  <div class="title">K-Mail 주소록</div>
  <button class="back" onclick="location.href='/pages/kmail-assistant.html'">K-Mail로</button>
</div>

<div id="search-bar">
  <input id="search-input" type="text" placeholder="이름·기관·직업·관계로 검색...">
</div>

<div id="list"></div>

<script>
const WORKER_URL = 'https://hondi-proxy.tensor-city.workers.dev';
let userGuid = null;
let userPubkey = null;
let contacts = [];

async function waitForWallet(timeoutMs = 5000) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) {
    if (window.gopangWallet?.guid && window.gopangWallet?.signPayload) {
      return { guid: window.gopangWallet.guid, pubkey: window.gopangWallet.publicKeyB64u || window.gopangWallet.publicKeyB64 || null };
    }
    await new Promise(r => setTimeout(r, 200));
  }
  return { guid: null, pubkey: null };
}

// PowerShell 테스트에서 확인된 것과 동일한 이유로, 서버 응답을 UTF-8로
// 명시적으로 디코딩한다 — 브라우저 fetch는 보통 문제없지만, 이 API
// 전체가 Content-Type에 charset을 안 붙이는 관례라 안전하게 맞춘다.
async function callApi(path, params) {
  const url = `${WORKER_URL}${path}?${new URLSearchParams(params).toString()}`;
  const res = await fetch(url);
  const text = await res.text();
  const data = JSON.parse(text);
  if (!res.ok || !data.ok) throw new Error(data.detail || data.message || ('HTTP ' + res.status));
  return data;
}

async function signAndBuild(sigMsg, extra) {
  const signature = await window.gopangWallet.signPayload(sigMsg);
  return { guid: userGuid, pubkey: userPubkey, signature, ...extra };
}

function initials(name, email) {
  const s = (name || email || '?').trim();
  return s.slice(0, 1).toUpperCase();
}

function fmtDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch { return iso; }
}

function renderContacts(list) {
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';
  if (list.length === 0) {
    listEl.innerHTML = '<div class="empty">저장된 연락처가 없습니다.</div>';
    return;
  }
  for (const c of list) {
    const card = document.createElement('div');
    card.className = 'contact-card';
    const metaParts = [c.org, c.occupation, c.relationship].filter(Boolean);
    card.innerHTML = `
      <div class="contact-head">
        <div class="avatar">${initials(c.name, c.email)}</div>
        <div class="info">
          <div class="name">${c.name || c.email}</div>
          <div class="meta">${c.email}${metaParts.length ? ' · ' + metaParts.join(' · ') : ''}</div>
        </div>
        <div class="chev">▶</div>
      </div>
      <div class="thread" data-email="${c.email}"></div>
    `;
    const head = card.querySelector('.contact-head');
    head.addEventListener('click', () => toggleThread(card, c.email));
    listEl.appendChild(card);
  }
}

async function toggleThread(card, email) {
  const wasOpen = card.classList.contains('open');
  card.classList.toggle('open', !wasOpen);
  if (wasOpen) return;

  const threadEl = card.querySelector('.thread');
  if (threadEl.dataset.loaded === 'true') return;

  threadEl.innerHTML = '<div class="thread-loading">불러오는 중...</div>';
  try {
    const ts = Date.now().toString();
    // 서버 sigMsg 형식과 정확히 일치해야 함: kmail-mailbox:{guid}:{box}:{ts}
    const sigMsg = `kmail-mailbox:${userGuid}:thread:${ts}`;
    const params = await signAndBuild(sigMsg, { ts, box: 'thread', with: email });
    const data = await callApi('/kmail/mailbox', params);
    threadEl.dataset.loaded = 'true';
    if (data.items.length === 0) {
      threadEl.innerHTML = '<div class="thread-loading">주고받은 메일이 없습니다.</div>';
      return;
    }
    threadEl.innerHTML = '';
    for (const m of data.items) {
      const row = document.createElement('div');
      row.className = 'mail-row';
      row.innerHTML = `
        <div class="row-top">
          <span class="dir ${m.direction}">${m.direction === 'sent' ? '보냄' : '받음'}</span>
          <span class="subject">${m.subject}</span>
          <span class="date">${fmtDate(m.created)}</span>
        </div>
        <div class="mail-body"></div>
      `;
      row.addEventListener('click', () => {
        row.classList.toggle('open');
        row.querySelector('.mail-body').textContent = m.body;
      });
      threadEl.appendChild(row);
    }
  } catch (e) {
    threadEl.innerHTML = `<div class="thread-loading">불러오기 실패: ${e.message}</div>`;
  }
}

document.getElementById('search-input').addEventListener('input', function () {
  const q = this.value.trim().toLowerCase();
  if (!q) { renderContacts(contacts); return; }
  renderContacts(contacts.filter(c =>
    (c.name || '').toLowerCase().includes(q) ||
    (c.email || '').toLowerCase().includes(q) ||
    (c.org || '').toLowerCase().includes(q) ||
    (c.occupation || '').toLowerCase().includes(q) ||
    (c.relationship || '').toLowerCase().includes(q)
  ));
});

(async function init() {
  const listEl = document.getElementById('list');
  listEl.innerHTML = '<div class="wallet-wait">지갑 연결 중...</div>';

  const w = await waitForWallet();
  userGuid = w.guid;
  userPubkey = w.pubkey;

  if (!userGuid) {
    listEl.innerHTML = '<div class="err">지갑 정보를 불러오지 못했습니다. 혼디 앱에서 다시 열어 주세요.</div>';
    return;
  }

  try {
    const ts = Date.now().toString();
    // 서버 sigMsg 형식과 정확히 일치해야 함: kmail-contacts-list:{guid}:{ts}
    const sigMsg = `kmail-contacts-list:${userGuid}:${ts}`;
    const params = await signAndBuild(sigMsg, { ts, status: 'confirmed' });
    const data = await callApi('/kmail/contacts', params);
    contacts = data.items;
    renderContacts(contacts);
  } catch (e) {
    listEl.innerHTML = `<div class="err">주소록을 불러오지 못했습니다: ${e.message}</div>`;
  }
})();
</script>
</body>
</html>
