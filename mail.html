<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메일 보내기 — 혼디</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/gh/Openhash-Gopang/gopang@main/gopang-wallet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Pretendard',sans-serif;background:#f5f5f5;color:#111;min-height:100dvh;padding:20px}
.wrap{max-width:520px;margin:0 auto}
h1{font-size:18px;margin-bottom:4px}
.sub{font-size:12.5px;color:#6b7280;margin-bottom:20px;line-height:1.6}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:14px}
.card label{display:block;font-size:12.5px;color:#6b7280;margin-bottom:6px}
.card input,.card textarea{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;margin-bottom:10px;font-family:inherit}
.submit-btn{width:100%;padding:12px;border:none;border-radius:10px;background:#111;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}
.submit-btn:disabled{background:#d1d5db;cursor:not-allowed}
.err{color:#9B1C1C;font-size:12.5px;margin-top:8px}
.ok{color:#166534;font-size:12.5px;margin-top:8px}
.note{background:#fef3c7;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:12px;color:#92400e;margin-bottom:14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>메일 보내기</h1>
  <div class="sub">외부 이메일 주소로 메일을 발송합니다.</div>
  <div class="note">⚠️ 발송만 가능합니다 — 받은 메일을 여기서 확인하는 기능(수신함)은 아직 없습니다. 답장은 상대방의 실제 이메일로 직접 받으셔야 합니다.</div>

  <div class="card">
    <label>받는 사람</label>
    <input id="f-to" type="email" placeholder="example@email.com">
    <label>제목</label>
    <input id="f-subject" type="text" placeholder="제목">
    <label>내용</label>
    <textarea id="f-text" rows="8" placeholder="내용을 입력하세요"></textarea>
    <button class="submit-btn" id="submit-btn" onclick="sendMail()">보내기</button>
    <div class="err" id="err" style="display:none"></div>
    <div class="ok" id="ok" style="display:none"></div>
  </div>
</div>

<script>
const WORKER_URL = 'https://hondi-proxy.tensor-city.workers.dev';
let userGuid = null;

async function waitForWallet(timeoutMs = 5000) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) {
    if (window.gopangWallet?.guid) return { guid: window.gopangWallet.guid };
    await new Promise(r => setTimeout(r, 200));
  }
  return { guid: null };
}

async function sendMail() {
  const err = document.getElementById('err');
  const ok = document.getElementById('ok');
  err.style.display = 'none'; ok.style.display = 'none';
  if (!userGuid) { err.textContent = '지갑 정보를 아직 불러오지 못했습니다.'; err.style.display = 'block'; return; }

  const to = document.getElementById('f-to').value.trim();
  const subject = document.getElementById('f-subject').value.trim();
  const text = document.getElementById('f-text').value.trim();
  if (!to || !subject || !text) { err.textContent = '받는 사람·제목·내용을 모두 입력해 주세요.'; err.style.display = 'block'; return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  try {
    const res = await fetch(`${WORKER_URL}/mail/send`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guid: userGuid, to, subject, text }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.message || 'HTTP ' + res.status);
    ok.textContent = '메일을 보냈습니다.';
    ok.style.display = 'block';
    document.getElementById('f-to').value = '';
    document.getElementById('f-subject').value = '';
    document.getElementById('f-text').value = '';
  } catch (e) {
    err.textContent = '발송 실패: ' + e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

(async function init() {
  const w = await waitForWallet();
  userGuid = w.guid;
})();
</script>
</body>
</html>
