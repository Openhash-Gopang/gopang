<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>사람과 사람 간에 반복되는 일상적 업무 — 시간과 노력이 많이 듦</title>
<desc>사람 A에서 사람 B로 화살대와 화살촉이 함께 서서히 이어지고, 다시 B에서 A로도 같은 방식으로 서서히 이어지며 방향에 따라 색이 바뀌는 모습과, 시계 바늘이 도는 모습으로 시간과 노력이 많이 듦을 표현</desc>
<style>
.arrAB{stroke-dasharray:152;animation:drawAB 3s ease-in-out infinite}
.arrBA{stroke-dasharray:152;animation:drawBA 3s ease-in-out infinite}
@keyframes drawAB{0%{stroke-dashoffset:152;opacity:1}45%{stroke-dashoffset:0;opacity:1}50%{stroke-dashoffset:0;opacity:0}99%{stroke-dashoffset:152;opacity:0}100%{stroke-dashoffset:152;opacity:1}}
@keyframes drawBA{0%{stroke-dashoffset:152;opacity:0}50%{stroke-dashoffset:152;opacity:1}95%{stroke-dashoffset:0;opacity:1}99%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:152;opacity:0}}
.headAB{transform-box:view-box;transform-origin:0 0;animation:moveAB 3s ease-in-out infinite}
.headBA{transform-box:view-box;transform-origin:0 0;animation:moveBA 3s ease-in-out infinite}
@keyframes moveAB{0%{transform:translate(264px,88px);opacity:1}45%{transform:translate(416px,88px);opacity:1}50%{transform:translate(416px,88px);opacity:0}99%{transform:translate(264px,88px);opacity:0}100%{transform:translate(264px,88px);opacity:1}}
@keyframes moveBA{0%{transform:translate(416px,88px);opacity:0}50%{transform:translate(416px,88px);opacity:1}95%{transform:translate(264px,88px);opacity:1}99%{transform:translate(264px,88px);opacity:0}100%{transform:translate(416px,88px);opacity:0}}
.hourhand{transform-box:view-box;transform-origin:340px 190px;animation:hourspin 18s linear infinite}
.minhand{transform-box:view-box;transform-origin:340px 190px;animation:minspin 5s linear infinite}
@keyframes hourspin{to{transform:rotate(360deg)}}
@keyframes minspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
.arrAB{animation:none;stroke-dashoffset:0;opacity:1}
.arrBA{animation:none;stroke-dashoffset:152;opacity:0}
.headAB{animation:none;transform:translate(416px,88px);opacity:1}
.headBA{animation:none;transform:translate(416px,88px);opacity:0}
.hourhand,.minhand{animation:none}
}
</style>
<rect x="0" y="0" width="680" height="340" fill="#0E1B3A"/>
<text x="340" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#E7EAF5" font-family="sans-serif">사람과 사람 간에 반복되는 일상적 업무</text>

<rect x="100" y="60" width="160" height="56" rx="8" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
<text x="180" y="80" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" fill="#E7EAF5" font-family="sans-serif">사람 A</text>
<text x="180" y="98" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#8891AC" font-family="sans-serif">IQ 100</text>

<rect x="420" y="60" width="160" height="56" rx="8" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
<text x="500" y="80" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" fill="#E7EAF5" font-family="sans-serif">사람 B</text>
<text x="500" y="98" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#8891AC" font-family="sans-serif">IQ 150</text>

<line class="arrAB" x1="264" y1="88" x2="416" y2="88" stroke="#D9A360" stroke-width="1.5"/>
<line class="arrBA" x1="416" y1="88" x2="264" y2="88" stroke="#8DA3C7" stroke-width="1.5"/>
<path class="headAB" d="M-9,-4.5 L0,0 L-9,4.5 Z" fill="#D9A360"/>
<path class="headBA" d="M9,-4.5 L0,0 L9,4.5 Z" fill="#8DA3C7"/>

<circle cx="340" cy="190" r="30" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
<line x1="340" y1="164" x2="340" y2="170" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
<line x1="340" y1="210" x2="340" y2="216" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
<line x1="314" y1="190" x2="320" y2="190" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
<line x1="360" y1="190" x2="366" y2="190" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
<line class="hourhand" x1="340" y1="190" x2="340" y2="172" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
<line class="minhand" x1="340" y1="190" x2="358" y2="190" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="340" cy="190" r="2" fill="rgba(255,255,255,0.7)"/>

<text x="340" y="245" text-anchor="middle" font-size="15" fill="#8891AC" font-family="sans-serif">시간과 노력이 많이 듭니다.</text>
</svg>
