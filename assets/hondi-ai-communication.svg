<svg width="680" height="296" viewBox="0 0 680 296" xmlns="http://www.w3.org/2000/svg" role="img">
<title>사람 간 직접 소통과 혼디를 통한 AI 간 소통 애니메이션</title>
<desc>1단계 정보 격차를 겪는 직접 소통, 2단계 사람이 혼디에게 요청, 3단계 혼디 간 빛의 속도 소통, 4단계 혼디가 사람에게 보고하는 순서로 진행되는 애니메이션</desc>
<style>
  .p1{opacity:0;animation:k1 8s ease-in-out infinite}
  .p2{opacity:1;animation:k2 8s ease-in-out infinite}
  .p3{opacity:1;animation:k3 8s ease-in-out infinite}
  .p4{opacity:1;animation:k4 8s ease-in-out infinite}
  @keyframes k1{0%{opacity:1}18%{opacity:1}24%{opacity:0}96%{opacity:0}100%{opacity:1}}
  @keyframes k2{0%{opacity:0}20%{opacity:0}26%{opacity:1}42%{opacity:1}48%{opacity:0}100%{opacity:0}}
  @keyframes k3{0%{opacity:0}44%{opacity:0}50%{opacity:1}66%{opacity:1}72%{opacity:0}100%{opacity:0}}
  @keyframes k4{0%{opacity:0}68%{opacity:0}74%{opacity:1}90%{opacity:1}96%{opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    .p1{animation:none;opacity:0}
    .p2{animation:none;opacity:1}
    .p3{animation:none;opacity:1}
    .p4{animation:none;opacity:1}
  }
</style>
<rect x="0" y="0" width="680" height="296" fill="#0E1B3A"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="44" y="88" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#B8C0D9" font-family="sans-serif">현행</text>
<text x="44" y="228" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#7C93FF" font-family="sans-serif">혼디</text>

<rect x="100" y="60" width="160" height="56" rx="8" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
<text x="180" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E7EAF5" font-family="sans-serif">사람 A</text>
<text x="180" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8891AC" font-family="sans-serif">IQ 100</text>

<rect x="420" y="60" width="160" height="56" rx="8" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
<text x="500" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E7EAF5" font-family="sans-serif">사람 B</text>
<text x="500" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8891AC" font-family="sans-serif">IQ 150</text>

<g class="p1">
<line x1="264" y1="80" x2="416" y2="96" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="416" y1="80" x2="264" y2="96" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="68" text-anchor="middle" font-size="12" fill="#8891AC" font-family="sans-serif">정보 격차</text>
</g>

<g class="p2">
<line x1="165" y1="116" x2="165" y2="200" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="140" y="158" text-anchor="end" font-size="12" fill="#8891AC" font-family="sans-serif">요청</text>
<line x1="485" y1="116" x2="485" y2="200" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="460" y="158" text-anchor="end" font-size="12" fill="#8891AC" font-family="sans-serif">요청</text>
</g>

<g class="p3">
<line x1="264" y1="220" x2="416" y2="236" stroke="#7C93FF" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="416" y1="220" x2="264" y2="236" stroke="#7C93FF" stroke-width="2" marker-end="url(#arrow)"/>
<text x="340" y="208" text-anchor="middle" font-size="12" fill="#C7D2FE" font-family="sans-serif">빛의 속도</text>
</g>

<g class="p4">
<line x1="195" y1="200" x2="195" y2="116" stroke="#7C93FF" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="220" y="158" text-anchor="start" font-size="12" fill="#7C93FF" font-family="sans-serif">보고</text>
<line x1="515" y1="200" x2="515" y2="116" stroke="#7C93FF" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="540" y="158" text-anchor="start" font-size="12" fill="#7C93FF" font-family="sans-serif">보고</text>
</g>

<rect x="100" y="200" width="160" height="56" rx="8" fill="#2F55D4" stroke="#7C93FF" stroke-width="0.5"/>
<text x="180" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#FFFFFF" font-family="sans-serif">혼디 A</text>
<text x="180" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#C7D2FE" font-family="sans-serif">IQ &gt;300</text>

<rect x="420" y="200" width="160" height="56" rx="8" fill="#2F55D4" stroke="#7C93FF" stroke-width="0.5"/>
<text x="500" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#FFFFFF" font-family="sans-serif">혼디 B</text>
<text x="500" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#C7D2FE" font-family="sans-serif">IQ &gt;300</text>
</svg>
