name: Live Smoketest — Tier Autopromotion (flash/pro)

on:
  workflow_dispatch:
    inputs:
      scenarios_file:
        description: "Scenario file name in tests/live_smoketest/"
        required: false
        default: ""
      worker_base:
        required: false
        default: "https://hondi-proxy.tensor-city.workers.dev"
      pb_base:
        required: false
        default: "https://l1-hanlim.hondi.net"

permissions:
  contents: write

jobs:
  run-tier-autopromotion-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run tier autopromotion live smoketest
        working-directory: tests/live_smoketest
        env:
          PB_ADMIN_EMAIL: ${{ secrets.L1_PB_ADMIN_EMAIL }}
          PB_ADMIN_PASSWORD: ${{ secrets.L1_PB_ADMIN_PASSWORD }}
        run: |
          SCEN="${{ github.event.inputs.scenarios_file }}"
          if [ -z "$SCEN" ]; then SCEN="scenarios_tier_autopromotion_20260814.json"; fi
          BASE=$(basename "$SCEN" .json)
          OUT="../../results/${BASE}"
          python3 tier_autopromotion_live_smoketest.py \
            --scenarios "$SCEN" --out "$OUT" \
            --worker-base "${{ github.event.inputs.worker_base || 'https://hondi-proxy.tensor-city.workers.dev' }}" \
            --pb-base "${{ github.event.inputs.pb_base || 'https://l1-hanlim.hondi.net' }}" \
            --resume

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-tier-autopromotion
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: Tier autopromotion live smoketest results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-tier-autopromotion

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-tier-autopromotion-results
          path: results/
