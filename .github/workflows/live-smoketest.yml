name: Live Smoketest (DeepSeek, 300 scenarios)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Debug: only run first N scenarios (blank = all 300)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run-live-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run live smoketest
        working-directory: tests/live_smoketest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ARGS="--scenarios scenarios.json --system-prompt ../../prompts/AC-PRO-CORE_v1_0.txt --out ../../results --resume"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python3 live_smoketest.py $ARGS

      - name: Commit results
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "chore: live smoketest results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-results
          path: results/