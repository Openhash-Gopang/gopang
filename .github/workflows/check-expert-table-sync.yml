name: Check EXPERT persona table sync

on:
  push:
    branches: [main]
    paths:
      - 'src/gopang/ai/expert-registry.js'
      - 'prompts/**'
      - 'tools/check_expert_table_sync_v2.py'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-expert-table-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── expert-registry.js(실제 전문가 페르소나 목록)와 §CATALOG-EXPERT 표
      # (AI가 배우는 목록, AGENT-COMMON 폐기 이후 AC-PRO-CORE로 이전)가
      # 어긋나지 않는지 검증. v1은 표 구조를 정규식으로 파싱해 AC-PRO-CORE
      # 리라이트 때 깨졌다(2026-07-29 발견, sp-catalog.json에 AGENT-COMMON
      # 키가 없어 매번 실패) — v2(텍스트 어디든 등장하는지만 확인)로 전환.
      - name: Run expert table sync check (v2)
        run: python3 tools/check_expert_table_sync_v2.py
