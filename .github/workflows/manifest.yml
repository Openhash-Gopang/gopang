name: Generate prompts manifest

on:
  push:
    branches: [main]
    paths:
      - 'prompts/**'
      - 'tools/build_manifest.py'
      - 'tools/archive_old_prompts.py'
  workflow_dispatch:

# 2026-09-01 수정 — 2026-08-29부터 main에 "PR을 통해서만 변경 가능" 규칙이
# 생기면서, 아래 옛 방식(git push 직접)이 그때부터 계속 조용히 실패하고
# 있었다(GH013: Repository rule violations — Changes must be made through
# a pull request). 이 저장소의 다른 모든 배포 파이프라인과 동일하게
# PR을 열고 사람이 머지하는 방식으로 바꾼다 — contents:write만으로는
# PR을 못 열어 pull-requests:write 권한 추가.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: manifest
  cancel-in-progress: true

jobs:
  build-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 오래된 버전 정리 (2026-07-05 신설) ───────────────────────────
      # manifest 생성보다 먼저 실행 — 계열당 최신 KEEP_LATEST개만 남기고
      # prompts/archive/로 이동. 최신본(manifest가 참조할 파일)은 항상
      # KEEP_LATEST 안에 들어가므로 manifest 결과에 영향 없음.
      - name: Archive old prompt versions
        run: python3 tools/archive_old_prompts.py

      # ── sp-catalog.json 생성 (2026-07-09: manifest.json에서 개명, W-16) ──
      - name: Generate prompts/sp-catalog.json
        run: python3 tools/build_manifest.py

      # ── 변경이 있을 때만 PR 생성(없으면 이 액션이 조용히 종료) ────────
      # main 직접 push 대신 PR을 연다 — 리포지토리 규칙 준수. 이 PR이
      # 머지되면 다시 push 이벤트가 발생해 이 워크플로가 재실행되지만,
      # 그 시점엔 이미 최신 상태라 diff가 없어 새 PR을 또 만들지 않는다
      # (무한 루프 아님).
      - name: Create PR with regenerated manifest and archive moves
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "ci: regenerate sp-catalog.json + archive old prompt versions"
          title: "ci: regenerate sp-catalog.json + archive old prompt versions"
          body: |
            자동 생성 — `tools/archive_old_prompts.py` + `tools/build_manifest.py` 실행 결과.
            `prompts/**` 변경 push에 반응해 자동으로 열린 PR입니다. 내용 확인 후 병합해 주세요.
          branch: ci/manifest-update
          delete-branch: true
          add-paths: prompts/
