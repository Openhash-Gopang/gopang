name: Triage user feedback (cluster + draft patch proposals)

on:
  schedule:
    # 사용자 피드백 취합은 코드 정합성 검사(check_wallet_sync 등)만큼
    # 긴급하지 않다 — 초기 단계라 피드백 절대량 자체가 많지 않을 것으로
    # 보여 매일이 아니라 주 1회로 잡는다(트래픽 늘면 주기 조정 검토).
    - cron: '0 22 * * 1'  # 매주 월요일 07:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: '--dry-run으로 실행(브릿지 없이 리포트만)'
        required: false
        default: 'false'

jobs:
  triage-feedback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── docs/user_feedback_mechanism_proposal_v1.md §4. status=new인
      # user_feedback을 임베딩·클러스터링하고, 표본이 충분한(3건↑) 클러스터는
      # /sp-updates/draft-patch(DeepSeek V4 Flash가 실제 SP 원문 참고해 초안 작성)를
      # 거쳐 sp_update_proposals에 pending_review로 올린다. 이 워크플로우
      # 자체는 SP 파일을 직접 건드리지 않고, 승인도 하지 않는다 — 사람
      # (주피터님)이 검토해야 다음 SP 버전에 반영된다.
      - name: Run feedback triage
        env:
          POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}
          POCKETBASE_ADMIN_EMAIL: ${{ secrets.POCKETBASE_ADMIN_EMAIL }}
          POCKETBASE_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_ADMIN_PASSWORD }}
          HONDI_WORKER_URL: https://hondi-proxy.tensor-city.workers.dev
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 tools/triage_feedback.py --dry-run
          else
            python3 tools/triage_feedback.py
          fi

      # data/feedback_triage_report.json은 renew_identity_templates.py의
      # identity_template_stats.json과 동일 관례 — 사람이 읽을 리포트라
      # git commit 대상이다.
      - name: Commit triage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 2026-07-28 수정 — triage_feedback.py는 처리할 신규 피드백이 없으면
          # (지금처럼 데이터가 아직 안 쌓인 초기 상태 포함) data/feedback_triage_report.json
          # 자체를 만들지 않고 조용히 종료한다(정상 설계 — main() 189행 조기 return).
          # 이 스텝이 그 파일이 무조건 있다고 가정하고 git add를 시도해 실패하고
          # 있었다(실사로 발견) — 파일 존재 여부를 먼저 확인한다.
          if [ -f data/feedback_triage_report.json ]; then
            git add data/feedback_triage_report.json
            git diff --staged --quiet || git commit -m "ci: 사용자 피드백 취합 리포트 갱신 [skip ci]"
            git push
          else
            echo "리포트 파일 없음(처리할 신규 피드백 없음) — 커밋할 것 없이 정상 종료"
          fi
