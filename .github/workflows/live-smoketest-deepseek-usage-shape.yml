name: Live Smoketest — DeepSeek Usage Field Shape

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-deepseek-usage-shape-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run DeepSeek usage field shape live smoketest
        working-directory: tests/live_smoketest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 deepseek_usage_shape_smoketest.py --out ../../results/deepseek_usage_shape

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-deepseek-usage-shape
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: DeepSeek usage field shape live smoketest results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-deepseek-usage-shape

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-deepseek-usage-shape-results
          path: results/
