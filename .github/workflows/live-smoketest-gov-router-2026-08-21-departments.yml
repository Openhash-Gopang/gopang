name: Live Smoketest — GOV-TASK-904-GAP 2026-08-21 부서 라우팅 (실제 DeepSeek)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-department-routing-smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run department routing + SP response live smoketest
        working-directory: tests/live_smoketest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node gov_router_2026_08_21_department_live_smoketest.mjs

      - name: Commit results to results branch
        if: always()
        run: |
          git config user.name "hondi-live-smoketest-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B results/live-smoketest-gov-router-2026-08-21-departments
          git add -f results/
          git diff --cached --quiet || git commit -m "chore: 2026-08-21 부서 라우팅 live smoketest results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force origin HEAD:results/live-smoketest-gov-router-2026-08-21-departments

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoketest-gov-router-2026-08-21-departments-results
          path: results/
